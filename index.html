<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>A Little Something</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 42%, #fff8fa 0%, #fcecef 42%, #f5dce3 100%);
}

/* =========================
   SLIDE
========================= */

#slide2 {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   HEART
========================= */

#heart {
    position: absolute;
    left: 50%;
    top: 39%;
    width: 145px;
    height: 130px;
    transform: translate(-50%, -50%) rotate(-45deg);
    background:
        radial-gradient(circle at 32% 25%,
            rgba(255,255,255,.85) 0 7%,
            rgba(255,255,255,.2) 17%,
            transparent 28%),
        linear-gradient(145deg,
            #ff6d82 0%,
            #e9284e 45%,
            #a9002a 100%);
    border-radius: 18px 18px 15px 18px;
    box-shadow:
        inset -12px -15px 22px rgba(95,0,25,.3),
        inset 9px 7px 16px rgba(255,255,255,.35),
        0 22px 35px rgba(104,0,28,.25);
    z-index: 5;
    transition:
        transform .25s ease,
        opacity .2s ease;
}

#heart::before,
#heart::after {
    content: "";
    position: absolute;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: inherit;
}

#heart::before {
    top: -72px;
    left: 0;
}

#heart::after {
    left: 72px;
    top: 0;
}

/* keep shine above the heart */
.heart-shine {
    position: absolute;
    width: 35px;
    height: 58px;
    left: 33px;
    top: 12px;
    border-radius: 50%;
    background: linear-gradient(
        90deg,
        rgba(255,255,255,.6),
        rgba(255,255,255,0)
    );
    transform: rotate(45deg);
    filter: blur(3px);
    z-index: 8;
}

/* =========================
   ARROW
========================= */

#arrow {
    position: absolute;
    left: 50%;
    bottom: 180px;
    width: 13px;
    height: 155px;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    z-index: 20;
    cursor: grab;
    touch-action: none;
}

#arrow:active {
    cursor: grabbing;
}

.arrow-shaft {
    position: absolute;
    left: 5px;
    top: 0;
    width: 4px;
    height: 145px;
    background: linear-gradient(
        90deg,
        #5c351d,
        #b77a42,
        #603719
    );
    border-radius: 3px;
    box-shadow: 1px 1px 3px rgba(0,0,0,.3);
}

.arrow-head {
    position: absolute;
    top: -2px;
    left: 0;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 17px solid #493124;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,.35));
}

.arrow-feather {
    position: absolute;
    bottom: 0;
    left: 1px;
    width: 11px;
    height: 25px;
}

.arrow-feather::before,
.arrow-feather::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 7px;
    background: #b88b68;
    border-radius: 100% 0 100% 0;
}

.arrow-feather::before {
    transform: rotate(25deg);
    top: 5px;
}

.arrow-feather::after {
    transform: rotate(-25deg);
    top: 13px;
}

/* =========================
   BOW
========================= */

#bow {
    position: absolute;
    left: 50%;
    bottom: 105px;
    width: 235px;
    height: 95px;
    transform: translateX(-50%);
    z-index: 18;
    pointer-events: none;
}

/* curved horizontal bow */
.bow-curve {
    position: absolute;
    left: 16px;
    top: 7px;
    width: 205px;
    height: 76px;
    border-top: 6px solid #704323;
    border-bottom: 6px solid #704323;
    border-radius: 50%;
    transform: rotate(0deg);
    box-shadow:
        0 2px 2px rgba(0,0,0,.2),
        inset 0 1px rgba(255,255,255,.25);
}

/* string */
.bow-string {
    position: absolute;
    left: 19px;
    top: 11px;
    width: 197px;
    height: 70px;
}

.bow-string::before,
.bow-string::after {
    content: "";
    position: absolute;
    left: 0;
    width: 197px;
    height: 2px;
    background: #5e493d;
    transform-origin: left center;
}

.bow-string::before {
    top: 0;
    transform: rotate(20deg);
}

.bow-string::after {
    bottom: 0;
    transform: rotate(-20deg);
}

.string-center {
    position: absolute;
    left: 97px;
    top: 31px;
    width: 3px;
    height: 38px;
    background: #5e493d;
}

/* grip */
.bow-grip {
    position: absolute;
    left: 110px;
    top: 29px;
    width: 16px;
    height: 38px;
    border-radius: 5px;
    background: linear-gradient(
        90deg,
        #4b2b18,
        #a76b39,
        #4b2b18
    );
}

/* =========================
   INSTRUCTION
========================= */

#instruction {
    position: absolute;
    left: 50%;
    bottom: 42px;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    color: #7c5961;
    font-size: 14px;
    letter-spacing: 1.5px;
    opacity: .85;
    z-index: 30;
}

/* =========================
   HEART PIECES
========================= */

.piece {
    position: absolute;
    width: 22px;
    height: 22px;
    left: 50%;
    top: 39%;
    background: linear-gradient(
        145deg,
        #ff7184,
        #c90031
    );
    border-radius: 5px;
    opacity: 0;
    z-index: 10;
    pointer-events: none;
}

@keyframes explode {
    0% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            translate(0,0)
            rotate(0deg)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(var(--x),var(--y))
            rotate(var(--r))
            scale(.35);
    }
}

/* =========================
   NEXT SLIDE
========================= */

#nextSlide {
    position: absolute;
    inset: 0;
    background: #faf5f4;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 1s ease;
}

#nextSlide.show {
    opacity: 1;
    pointer-events: auto;
}

#nextSlide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* fallback if image isn't supplied */
.next-message {
    position: absolute;
    color: #76535b;
    font-size: 18px;
    letter-spacing: 2px;
}

/* =========================
   IMPACT FLASH
========================= */

#impact {
    position: absolute;
    left: 50%;
    top: 39%;
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 15px 8px rgba(255,255,255,.8),
        0 0 45px 20px rgba(255,80,110,.35);
    opacity: 0;
    z-index: 50;
    pointer-events: none;
}

@keyframes impactFlash {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.2);
    }

    35% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(8);
    }
}
</style>
</head>

<body>

<div id="slide2">

    <!-- HEART -->
    <div id="heart">
        <div class="heart-shine"></div>
    </div>

    <!-- IMPACT -->
    <div id="impact"></div>

    <!-- HEART PIECES -->
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>
    <div class="piece"></div>

    <!-- ARROW -->
    <div id="arrow">
        <div class="arrow-head"></div>
        <div class="arrow-shaft"></div>
        <div class="arrow-feather"></div>
    </div>

    <!-- BOW -->
    <div id="bow">
        <div class="bow-curve"></div>
        <div class="bow-string"></div>
        <div class="string-center"></div>
        <div class="bow-grip"></div>
    </div>

    <div id="instruction">
        PULL THE ARROW DOWN &nbsp;•&nbsp; RELEASE
    </div>

    <!--
      Replace this image URL with the silver-jhumka image
      if you want the next slide to open after impact.
    -->
    <div id="nextSlide">
        <div class="next-message">
            <img id="nextImage" src="" alt="">
        </div>
    </div>

</div>

<script>
const arrow = document.getElementById("arrow");
const heart = document.getElementById("heart");
const impact = document.getElementById("impact");
const instruction = document.getElementById("instruction");
const pieces = document.querySelectorAll(".piece");

let dragging = false;
let released = false;

const originalBottom = 180;

/* =========================
   TOUCH / MOUSE
========================= */

function pointerDown(e) {
    if (released) return;

    dragging = true;
    arrow.setPointerCapture?.(e.pointerId);
}

function pointerMove(e) {
    if (!dragging || released) return;

    const rect = document.getElementById("slide2").getBoundingClientRect();

    let y = e.clientY - rect.top;

    /*
      Arrow moves DOWN while pulling.
      Limit keeps it close to the bow.
    */
    const minY = rect.height - 390;
    const maxY = rect.height - 110;

    y = Math.max(minY, Math.min(maxY, y));

    const newBottom = rect.height - y - 70;

    arrow.style.bottom = newBottom + "px";

    /*
      Pull bow string slightly with arrow.
    */
    const pullAmount = Math.max(
        0,
        originalBottom - newBottom
    );

    const stringCenter = document.querySelector(".string-center");

    stringCenter.style.height =
        (38 + pullAmount * .35) + "px";
}

function pointerUp(e) {
    if (!dragging || released) return;

    dragging = false;
    released = true;

    arrow.releasePointerCapture?.(e.pointerId);

    shootArrow();
}

arrow.addEventListener("pointerdown", pointerDown);
document.addEventListener("pointermove", pointerMove);
document.addEventListener("pointerup", pointerUp);

/* =========================
   SHOOT
========================= */

function shootArrow() {

    instruction.style.opacity = "0";

    const startBottom = parseFloat(
        getComputedStyle(arrow).bottom
    );

    const startX = window.innerWidth / 2;

    const heartRect = heart.getBoundingClientRect();
    const arrowRect = arrow.getBoundingClientRect();

    const targetY =
        heartRect.top +
        heartRect.height * .48;

    const startY =
        arrowRect.top;

    /*
      We animate the arrow upward slowly enough
      that the trajectory is visible.
    */

    const duration = 1200;

    const startTime = performance.now();

    function animate(now) {

        const progress =
            Math.min(
                1,
                (now - startTime) / duration
            );

        /*
          Ease-in-out trajectory.
        */
        const eased =
            progress < .5
                ? 2 * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        const currentY =
            startY +
            (targetY - startY) * eased;

        /*
          Arrow points upward.
        */
        arrow.style.position = "fixed";
        arrow.style.left = startX + "px";
        arrow.style.top =
            (currentY - 70) + "px";
        arrow.style.bottom = "auto";
        arrow.style.transform =
            "translateX(-50%)";

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            hitHeart();
        }
    }

    requestAnimationFrame(animate);
}

/* =========================
   HEART IMPACT
========================= */

function hitHeart() {

    /*
      Arrow reaches the heart FIRST.
    */
    arrow.style.zIndex = "60";

    impact.style.animation =
        "impactFlash .45s ease-out forwards";

    /*
      Tiny pause after visible impact.
    */
    setTimeout(() => {

        arrow.style.opacity = "0";

        /*
          Break the heart apart.
        */
        heart.style.opacity = "0";
        heart.style.transform =
            "translate(-50%,-50%) rotate(-45deg) scale(.7)";

        explodeHeart();

    }, 220);
}

/* =========================
   EXPLODE HEART
========================= */

function explodeHeart() {

    const directions = [
        [-95,-55,-35],
        [-55,-105,70],
        [-20,-135,-55],
        [30,-115,85],
        [78,-85,-70],
        [112,-30,110],
        [-125,15,-100],
        [-75,55,55],
        [-20,90,-80],
        [35,75,120],
        [82,45,-120],
        [130,5,70]
    ];

    pieces.forEach((piece, i) => {

        piece.style.setProperty(
            "--x",
            directions[i][0] + "px"
        );

        piece.style.setProperty(
            "--y",
            directions[i][1] + "px"
        );

        piece.style.setProperty(
            "--r",
            directions[i][2] + "deg"
        );

        piece.style.opacity = "1";

        piece.style.animation =
            "explode 1.25s cubic-bezier(.15,.7,.25,1) forwards";

    });

    /*
      After the heart breaks, continue to the
      next part of the journey.
    */
    setTimeout(() => {

        const next =
            document.getElementById("nextSlide");

        /*
          If you have an image, set it here:
          
          document.getElementById("nextImage").src =
              "your-image.jpg";
        */

        next.classList.add("show");

    }, 1450);
}
</script>

</body>
  </html>
